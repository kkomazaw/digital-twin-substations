---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-webapp
  namespace: it-zone
spec:
  selector:
    app: dashboard-webapp
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-webapp
  namespace: it-zone
  labels:
    app: dashboard-webapp
    zone: it
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-webapp
  template:
    metadata:
      labels:
        app: dashboard-webapp
        zone: it
    spec:
      containers:
      - name: dashboard-webapp
        image: image-registry.openshift-image-registry.svc:5000/it-zone/dashboard-webapp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dashboard-webapp
  namespace: it-zone
spec:
  to:
    kind: Service
    name: dashboard-webapp
  port:
    targetPort: http
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: dashboard-webapp
  namespace: it-zone
spec:
  output:
    to:
      kind: ImageStreamTag
      name: dashboard-webapp:latest
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  triggers: []
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: dashboard-webapp
  namespace: it-zone
spec:
  lookupPolicy:
    local: true
